name: Homebrew bottles

# Packages the raw binaries of an existing release into real Homebrew
# bottles, publishes the bottles plus the complete generated formula to that
# same release, verifies the published bytes, and waits for the live tap
# to match exactly. Automatic mode opens a PR; both modes require publication
# on the default branch. Nothing is compiled and no tag is touched, so this
# same workflow backfills an already-published release via workflow_dispatch.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to package (v<version>)
        required: true
        type: string
      tap_publish_mode:
        description: automatic opens a PR; manual requires an external publisher; BOTH wait for the live tap
        type: string
        default: automatic
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package (v<version>); binaries are repackaged, never rebuilt
        required: true
        type: string

      tap_publish_mode:
        description: Both modes wait up to 30 minutes for the default-branch formula
        type: choice
        options: [automatic, manual]
        default: automatic

permissions:
  contents: write

concurrency:
  group: homebrew-bottles-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  TAP_REPO: knit-cli/homebrew-tap

jobs:
  bottles:
    name: package and publish bottles
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TAP_PUBLISH_MODE: ${{ inputs.tap_publish_mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          set -euo pipefail
          case "$TAP_PUBLISH_MODE" in manual|automatic) ;; *) echo "::error::invalid tap_publish_mode"; exit 1 ;; esac
          tag="${RELEASE_TAG:?release_tag is required}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::refusing to package '${tag}': expected a v<semver> release tag" >&2
            exit 1
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null

      - name: Download raw release assets
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern "knit-v${version}-*.tar.gz" \
            --pattern "knit-v${version}-*.sha256"

      # Manual dispatch of this workflow bypasses the release gate, so run
      # the packager's own tests here too.
      - name: Homebrew packaging tests
        run: python3 -m unittest discover -s scripts -p 'homebrew*_test.py' -v

      - name: Package bottles and formula
        run: |
          set -euo pipefail
          python3 scripts/homebrew_bottles.py \
            --version "${RELEASE_TAG#v}" --assets-dir assets --output-dir homebrew-dist

      # Before publishing any bottle/formula assets, automatic mode requires
      # a credential unless this exact formula is already live (recovery).
      - name: Preflight tap publication
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: >-
          python3 scripts/homebrew_tap.py preflight --repo "$TAP_REPO"
          --formula homebrew-dist/knit.rb --mode "$TAP_PUBLISH_MODE"

      # Release assets are immutable: upload only what is missing, and if an
      # asset already exists under the same name its published bytes must be
      # identical to what we just generated (idempotent re-runs are fine,
      # silent replacement is not). Bottles go up first and the formula
      # asset last, so the published formula never advertises bottles that
      # are not on the release yet during a partial upload.
      - name: Publish bottles and formula
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cp homebrew-dist/knit.rb "homebrew-dist/knit-v${version}-formula.rb"

          publish() {
            local file="$1" name want tmp got
            name="$(basename "$file")"
            want="$(sha256sum "$file" | awk '{print $1}')"
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              | jq -e --arg n "$name" '.assets[] | select(.name == $n)' > /dev/null; then
              tmp="$(mktemp -d)"
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --dir "$tmp" --pattern "$name"
              got="$(sha256sum "$tmp/$name" | awk '{print $1}')"
              if [[ "$got" != "$want" ]]; then
                echo "::error::$name is already published hashing to $got; refusing to replace it with different bytes ($want)" >&2
                exit 1
              fi
              echo "$name already published with identical bytes; nothing to do."
            else
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$file"
            fi
          }

          for bottle in homebrew-dist/bottles/*.bottle.tar.gz; do
            publish "$bottle"
          done
          publish "homebrew-dist/knit-v${version}-formula.rb"

      - name: Upload packaging artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-bottles
          path: homebrew-dist
          # Only Actions artifacts are replaced on rerun, never release assets.
          overwrite: true

  tap-bump:
    name: verify published bottles and complete live tap publication
    needs: bottles
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      TAP_PUBLISH_MODE: ${{ inputs.tap_publish_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-bottles
          path: homebrew-dist

      # Re-download everything the formula references from the live release
      # and compare bytes: the tap PR can only ever be opened against
      # published, verified artifacts, so a fresh version can never inherit
      # stale bottles.
      - name: Verify published bytes match the generated formula
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir published
          patterns=()
          while read -r want name; do
            patterns+=(--pattern "$name")
          done < homebrew-dist/SHA256SUMS
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir published "${patterns[@]}" --pattern "knit-v${version}-formula.rb"

          while read -r want name; do
            got="$(sha256sum "published/$name" | awk '{print $1}')"
            if [[ "$got" != "$want" ]]; then
              echo "::error::published $name hashes to $got, expected $want" >&2
              exit 1
            fi
          done < homebrew-dist/SHA256SUMS

          diff -u homebrew-dist/knit.rb "published/knit-v${version}-formula.rb"

          python3 - "$version" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          version = sys.argv[1]
          root = pathlib.Path("homebrew-dist")
          manifest = json.loads((root / "manifest.json").read_text())
          formula = (root / "knit.rb").read_text()
          assert 'version "%s"' % version in formula
          assert manifest["version"] == version
          for tag, info in sorted(manifest["bottles"].items()):
              digest = hashlib.sha256((root / "bottles" / info["file"]).read_bytes()).hexdigest()
              assert digest == info["sha256"], tag
              assert 'cellar: :any_skip_relocation, {}: "{}"'.format(tag, digest) in formula, tag
          print("verified %d bottle digests against the formula" % len(manifest["bottles"]))
          PY

      # This receipt is created only after the published-byte checks succeed.
      - name: Record verified handoff provenance
        run: |
          set -euo pipefail
          SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          export SOURCE_SHA
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          source_sha = os.environ["SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise ValueError("release tag did not resolve to a commit SHA")
          root = Path("homebrew-dist")
          metadata = {
              "release_tag": os.environ["RELEASE_TAG"],
              "source_sha": source_sha,
              "workflow_sha": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": "{}/{}/actions/runs/{}".format(
                  os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"],
                  os.environ["GITHUB_RUN_ID"]),
              "formula_sha256": hashlib.sha256((root / "knit.rb").read_bytes()).hexdigest(),
              "published_bytes_verified": True,
          }
          (root / "verification.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYTHON

      - name: Upload verified tap handoff
        uses: actions/upload-artifact@v4
        with:
          name: verified-homebrew-tap
          overwrite: true
          path: |
            homebrew-dist/knit.rb
            homebrew-dist/manifest.json
            homebrew-dist/SHA256SUMS
            homebrew-dist/verification.json
          if-no-files-found: error

      - name: Check whether the live tap already matches
        id: live
        run: |
          set -euo pipefail
          if python3 scripts/homebrew_tap.py check --repo "$TAP_REPO" --formula homebrew-dist/knit.rb; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require automatic publishing credential when needed
        if: inputs.tap_publish_mode == 'automatic' && steps.live.outputs.matches != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Automatic publication requires HOMEBREW_TAP_TOKEN; live tap has not been verified identical."
            exit 1
          fi

      - name: Open tap formula PR
        if: inputs.tap_publish_mode == 'automatic' && steps.live.outputs.matches != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          branch="bump-knit-${version}-${GITHUB_RUN_ID}"
          gh auth setup-git
          git clone "https://github.com/${TAP_REPO}.git" tap
          cd tap
          base="$(git symbolic-ref --short refs/remotes/origin/HEAD)"
          base="${base#origin/}"
          git switch -c "$branch"
          cp "${GITHUB_WORKSPACE}/homebrew-dist/knit.rb" Formula/knit.rb
          if git diff --quiet; then
            echo "::notice::tap formula already serves ${version}; no PR needed."
            exit 0
          fi
          git config user.name "knit-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Formula/knit.rb
          git commit -m "knit ${version}"
          git push -u origin "$branch"
          gh pr create \
            --repo "${TAP_REPO}" \
            --title "knit ${version}" \
            --body "Automated formula bump for knit ${version}, generated from the ${RELEASE_TAG} release assets. The bottle checksums were verified against the published release before this PR was opened." \
            --head "$branch" \
            --base "$base"

      - name: Announce pending tap publication
        if: steps.live.outputs.matches != 'true'
        run: |
          message="Tap publication pending for ${RELEASE_TAG} (${TAP_PUBLISH_MODE} mode). Publish and merge verified-homebrew-tap/knit.rb as Formula/knit.rb in ${TAP_REPO}. This run waits up to 30 minutes for exact bytes on the default branch; an open PR is not completion."
          echo "::notice::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

      - name: Require exact live tap formula
        run: >-
          python3 scripts/homebrew_tap.py wait --repo "$TAP_REPO"
          --formula homebrew-dist/knit.rb --timeout 1800 --interval 20

      - name: Record completed tap publication
        run: echo "Live tap publication complete for ${RELEASE_TAG}; default-branch formula matches verified release bytes exactly." >> "$GITHUB_STEP_SUMMARY"
