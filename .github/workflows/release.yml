name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # CI runs on branches and pull requests, not on tags, so without this a tag
  # could publish binaries that never passed a gate. Everything the release is
  # allowed to be wrong about has to be checked here, before any asset exists:
  # a published release is not something you can take back.
  verify:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Includes the schema-parity test: the schemas `knit schema print`
      # publishes have to describe what this build actually writes.
      - run: cargo test --no-fail-fast

  # The manifests advertise a minimum Rust version; a release that cannot be
  # built on it is advertising something untrue.
  verify-msrv:
    name: release gate (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  # upload-rust-binary-action uploads assets to an existing release; create it
  # first so tag pushes work unattended.
  create-release:
    needs: [verify, verify-msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Intel macOS is cross-compiled from the arm64 runner; the macos-13
          # (last Intel) runner pool was retired by GitHub.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: knit
          target: ${{ matrix.target }}
          archive: knit-$tag-${{ matrix.target }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/${{ github.ref_name }}
          features: ""
      - name: Mark as pre-release
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --prerelease

  bump-homebrew-tap:
    needs: upload-assets
    runs-on: ubuntu-latest
    env:
      TAP_REPO: knit-cli/homebrew-tap
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip when tap token is not configured
        if: env.TAP_TOKEN == ''
        run: |
          echo '::warning::HOMEBREW_TAP_TOKEN is not configured, so the Homebrew formula was NOT bumped and brew install knit-cli/tap/knit still serves the previous release. Add the secret, or bump Formula/knit.rb in knit-cli/homebrew-tap by hand.'

      - name: Download release checksums
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.sha256" \
            --dir shas

      - name: Open tap formula bump PR
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TAP_TOKEN }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          branch="bump-knit-${version}-${GITHUB_RUN_ID}"

          read_sha() {
            local target="$1"
            awk '{print $1}' "shas/knit-v${version}-${target}.sha256"
          }

          arm_macos_sha="$(read_sha aarch64-apple-darwin)"
          intel_macos_sha="$(read_sha x86_64-apple-darwin)"
          arm_linux_sha="$(read_sha aarch64-unknown-linux-musl)"
          intel_linux_sha="$(read_sha x86_64-unknown-linux-musl)"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          git switch -c "${branch}"

          python3 - \
            "${version}" \
            "${arm_macos_sha}" \
            "${intel_macos_sha}" \
            "${arm_linux_sha}" \
            "${intel_linux_sha}" <<'PY'
          import re
          import sys

          version, arm_macos, intel_macos, arm_linux, intel_linux = sys.argv[1:6]
          path = "Formula/knit.rb"
          with open(path, encoding="utf-8") as handle:
              formula = handle.read()

          formula = re.sub(r'version "[^"]*"', f'version "{version}"', formula, count=1)
          replacements = {
              "aarch64-apple-darwin": arm_macos,
              "x86_64-apple-darwin": intel_macos,
              "aarch64-unknown-linux-musl": arm_linux,
              "x86_64-unknown-linux-musl": intel_linux,
          }
          for target, sha in replacements.items():
              pattern = rf'(knit-v#\{{version\}}-{re.escape(target)}\.tar\.gz"\n\s*sha256 ")[0-9a-f]{{64}}'
              formula, count = re.subn(pattern, rf'\g<1>{sha}', formula, count=1)
              if count != 1:
                  raise SystemExit(f"failed to update sha for {target}")

          with open(path, "w", encoding="utf-8") as handle:
              handle.write(formula)
          PY

          if git diff --quiet; then
            echo "::notice::Homebrew formula already points at ${version}."
            exit 0
          fi

          git config user.name "knit-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Formula/knit.rb
          git commit -m "knit ${version}"
          git push -u origin "${branch}"
          gh pr create \
            --repo "${TAP_REPO}" \
            --title "knit ${version}" \
            --body "Automated formula bump for knit ${version}." \
            --head "${branch}" \
            --base main
