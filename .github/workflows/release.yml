name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publication-mode:
    name: tap publication preflight
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      # Explicit policy: a publisher lands the verified formula through Knit.
      TAP_PUBLISH_MODE: manual
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - id: mode
        run: |
          set -euo pipefail
          case "$TAP_PUBLISH_MODE" in
            manual) ;;
            automatic)
              if [ -z "$TAP_TOKEN" ]; then
                echo "::error::Automatic tap publication requires HOMEBREW_TAP_TOKEN before creating release assets."
                exit 1
              fi
              ;;
            *) echo "::error::invalid tap publication mode"; exit 1 ;;
          esac
          echo "mode=$TAP_PUBLISH_MODE" >> "$GITHUB_OUTPUT"

  # CI runs on branches and pull requests, not on tags, so without this a tag
  # could publish binaries that never passed a gate. Everything the release is
  # allowed to be wrong about has to be checked here, before any asset exists:
  # a published release is not something you can take back.
  verify:
    name: release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Includes the schema-parity test: the schemas `knit schema print`
      # publishes have to describe what this build actually writes.
      - run: cargo test --no-fail-fast
      # Releases publish Homebrew bottles generated by
      # scripts/homebrew_bottles.py; the packager itself is gated too.
      - name: Packaging tests
        run: python3 -m unittest discover -s scripts -p '*_test.py' -v

  # The manifests advertise a minimum Rust version; a release that cannot be
  # built on it is advertising something untrue.
  verify-msrv:
    name: release gate (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  # upload-rust-binary-action uploads assets to an existing release; create it
  # first so tag pushes work unattended.
  create-release:
    needs: [verify, verify-msrv, publication-mode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # Intel macOS is cross-compiled from the arm64 runner; the macos-13
          # (last Intel) runner pool was retired by GitHub.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing raw release assets
        id: raw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >-
          python3 scripts/release_assets.py check --repo "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.raw.outputs.complete != 'true'
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: steps.raw.outputs.complete != 'true'
        with:
          target: ${{ matrix.target }}
      # Both macOS builds (native arm64 and cross-compiled x86_64) share the
      # deployment target that the Homebrew bottle floor (big_sur) claims.
      - name: Pin macOS deployment target
        if: runner.os == 'macOS' && steps.raw.outputs.complete != 'true'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      # The action's normal upload uses --clobber. Build locally only; our
      # publisher checks existing bytes and uploads missing files without it.
      - uses: taiki-e/upload-rust-binary-action@v1
        if: steps.raw.outputs.complete != 'true'
        with:
          bin: knit
          target: ${{ matrix.target }}
          archive: knit-$tag-${{ matrix.target }}
          checksum: sha256
          dry-run: true
          dry-run-intended: true
          ref: refs/tags/${{ github.ref_name }}
          features: ""
      # Retain the original build if publication stops between pair members.
      # Attempt-specific names keep a later rebuild from replacing recovery bytes.
      - name: Retain raw asset pair for recovery
        if: steps.raw.outputs.complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: raw-release-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            knit-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            knit-${{ github.ref_name }}-${{ matrix.target }}.zip
            knit-${{ github.ref_name }}-${{ matrix.target }}.sha256
          if-no-files-found: error

      - name: Publish immutable raw release assets
        if: steps.raw.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >-
          python3 scripts/release_assets.py publish --repo "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - name: Mark as pre-release
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --prerelease

  # Repackage the just-uploaded raw binaries into Homebrew bottles, publish
  # them plus the complete generated formula to this release, verify the
  # published bytes, and require the exact formula on the live tap. The reusable
  # workflow is also manually dispatchable to backfill an existing release tag.
  homebrew-bottles:
    needs: [upload-assets, publication-mode]
    uses: ./.github/workflows/homebrew.yml
    with:
      release_tag: ${{ github.ref_name }}
      tap_publish_mode: ${{ needs.publication-mode.outputs.mode }}
    permissions:
      contents: write
    secrets: inherit

  linux-packages:
    needs: upload-assets
    uses: ./.github/workflows/linux-packages.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: write
      pages: write
    secrets: inherit
